      - name: SC236D candidate DC limits and reset integration
        run: |
          python3 verification/robotron-keyboard/analog/reset_probe.py --reset-load reference-capacitance --npn-profile sc236-dc --out build/keyboard-controller-analog/reset-reference-capacitance
          python3 verification/robotron-keyboard/analog/device_probe.py --npn-profile sc236-dc --require-qualified
          python3 verification/robotron-keyboard/analog/reset_probe.py --npn-profile sc236-dc --out build/keyboard-controller-analog/reset-sc236
          python3 verification/robotron-keyboard/analog/reset_probe.py --npn-profile sc236-dc --rise-us .01 --source-ohms .1 --out build/keyboard-controller-analog/reset-fast-resistive
      - name: DL000 candidate static output and input limits
        run: python3 verification/robotron-keyboard/analog/gate_probe.py --model verification/robotron-keyboard/analog/ls_nand_dc.cir --require-qualified
