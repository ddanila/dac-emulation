name: Native and browser cores
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cores-${{ github.ref }}
  cancel-in-progress: true
jobs:
  keyboard-controller:
    name: Keyboard reference wiring and full bus audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y iverilog ngspice libmpfr-dev libgmp-dev pkg-config
      - run: make test-keyboard-controller audit-keyboard-controller
      - name: Digital qualification gates and numerical diagnostics
        run: |
          python3 verification/robotron-keyboard/digital/test_qualify.py
          python3 verification/robotron-keyboard/digital/test_c_read_contract.py
          python3 verification/robotron-keyboard/digital/io_final_suite.py instructions
          python3 verification/robotron-keyboard/digital/io_flags_probe.py --quick --out build/keyboard-controller-io-flags-ci
          python3 verification/robotron-keyboard/digital/io_final_regression.py read
          python3 verification/robotron-keyboard/digital/io_final_regression.py nonio
          python3 verification/robotron-keyboard/digital/io_write_probe.py
          python3 verification/robotron-keyboard/digital/io_repeat_probe.py
          python3 verification/robotron-keyboard/digital/io_pin_review.py --require-pass
          python3 verification/robotron-keyboard/digital/io_boundary_evidence.py
          python3 verification/robotron-keyboard/digital/io_final_evidence.py
          python3 verification/robotron-keyboard/digital/cpu_bus_review.py
          python3 verification/robotron-keyboard/digital/cpu_bus_cross.py --pins --require-pass
          python3 verification/robotron-keyboard/digital/cpu_bus_instructions.py
          python3 verification/robotron-keyboard/digital/cpu_bus_evidence.py
          python3 verification/robotron-keyboard/digital/c_read_evidence.py
          python3 verification/robotron-keyboard/digital/verify_joint_phase.py
          python3 verification/robotron-keyboard/digital/joint_repeat.py --verify verification/robotron-keyboard/digital/reports/joint-repeat
          python3 verification/robotron-keyboard/digital/pin_timing.py
          python3 verification/robotron-keyboard/digital/pin_timing.py --verify verification/robotron-keyboard/digital/reports/pin-timing
          python3 verification/robotron-keyboard/analog/test_history_sensitivity_review.py
          python3 verification/robotron-keyboard/analog/test_postcap_additions.py
          python3 verification/robotron-keyboard/analog/test_cosim_input_barrier.py
          python3 verification/robotron-keyboard/analog/test_cosim_dispatch_rollback.py
          python3 verification/robotron-keyboard/analog/test_cosim_registration.py
          python3 verification/robotron-keyboard/analog/test_eval_cache.py
          python3 verification/robotron-keyboard/analog/test_eval_cache_benchmark.py
          python3 verification/robotron-keyboard/analog/test_bus_read_replay.py
          python3 verification/robotron-keyboard/analog/test_bus_device_review.py
          python3 verification/robotron-keyboard/analog/test_bus_transition.py
          python3 verification/robotron-keyboard/analog/test_dac_ramp.py
          python3 verification/robotron-keyboard/analog/test_dac_state_audit.py
          python3 verification/robotron-keyboard/analog/test_startup_truncation_audit.py
          python3 verification/robotron-keyboard/analog/test_filter_truncation_audit.py
          python3 verification/robotron-keyboard/analog/test_filter_truncation_log.py
          python3 verification/robotron-keyboard/analog/test_filter_truncation_review.py
          python3 verification/robotron-keyboard/analog/test_charge_history_sensitivity.py
          python3 verification/robotron-keyboard/analog/test_transient_error_control.py
          python3 verification/robotron-keyboard/analog/test_startup_truncation_review.py
          python3 verification/robotron-keyboard/analog/test_startup_truncation_log.py
          python3 verification/robotron-keyboard/analog/test_dac_anchor.py
          python3 verification/robotron-keyboard/analog/test_live_state.py
          python3 verification/robotron-keyboard/analog/test_fixture_crossing_grid.py
          python3 verification/robotron-keyboard/analog/test_fixture_grid_review.py
          python3 verification/robotron-keyboard/analog/test_sampling_grid.py
          python3 verification/robotron-keyboard/analog/test_common_samples.py
          python3 verification/robotron-keyboard/analog/test_solver_tolerances.py
          python3 verification/robotron-keyboard/analog/test_tolerance_controls_review.py
          python3 verification/robotron-keyboard/analog/test_startup_passive_review.py
          python3 verification/robotron-keyboard/analog/test_refinement_peak_review.py
          python3 verification/robotron-keyboard/analog/test_sampling_error_review.py
          python3 verification/robotron-keyboard/analog/test_local_refinement_grid.py
          python3 verification/robotron-keyboard/analog/test_startup_grid_review.py
          python3 verification/robotron-keyboard/analog/test_startup_tolerance_review.py
          python3 verification/robotron-keyboard/analog/test_switching_event.py
          python3 verification/robotron-keyboard/analog/test_output_switch.py
          python3 verification/robotron-keyboard/analog/test_inductor_chain.py
          python3 verification/robotron-keyboard/analog/test_paired_cap_history.py
          python3 verification/robotron-keyboard/analog/test_network_refinement.py
          python3 verification/robotron-keyboard/analog/test_numerical_voltage_budget.py
          python3 verification/robotron-keyboard/analog/test_boundary_trace.py
          python3 verification/robotron-keyboard/analog/test_adc_crossing.py
          python3 verification/robotron-keyboard/analog/test_boundary_evidence.py
          python3 verification/robotron-keyboard/analog/test_ttl7406_dynamic.py
          python3 verification/robotron-keyboard/analog/test_cpu_serial_drive.py
          python3 verification/robotron-keyboard/analog/test_serial_path.py
          python3 verification/robotron-keyboard/analog/switching_event_review.py verification/robotron-keyboard/analog/reports/switching-events --verify
          python3 verification/robotron-keyboard/analog/test_live_transition.py
          python3 verification/robotron-keyboard/analog/live_transition_review.py --verify --out verification/robotron-keyboard/analog/reports/live-transition
          python3 verification/robotron-keyboard/analog/bus_device_review.py --verify --out verification/robotron-keyboard/analog/reports/bus-device-admission/assessment.json
          python3 verification/robotron-keyboard/analog/bus_transition_review.py --verify --out verification/robotron-keyboard/analog/reports/bus-transition
          python3 verification/robotron-keyboard/analog/bus_read_replay.py --verify --out verification/robotron-keyboard/analog/reports/bus-read-replay
          python3 verification/robotron-keyboard/analog/eval_cache_benchmark.py --verify --out verification/robotron-keyboard/analog/reports/eval-cache
          python3 verification/robotron-keyboard/analog/eval_cache_benchmark.py --verify --out verification/robotron-keyboard/analog/reports/eval-cache-bus-read
          python3 verification/robotron-keyboard/analog/eval_cache_benchmark.py --verify --out verification/robotron-keyboard/analog/reports/eval-cache-startup-2ms
          python3 verification/robotron-keyboard/analog/test_coupled_acceptance.py
          python3 verification/robotron-keyboard/analog/test_device_additions.py
          python3 verification/robotron-keyboard/analog/device_endpoint_probe.py --verify verification/robotron-keyboard/analog/reports/device-endpoints
          python3 verification/robotron-keyboard/analog/bridge_time_review.py --verify --out verification/robotron-keyboard/analog/reports/qualified-cpu-bridge-time
          python3 verification/robotron-keyboard/analog/input_barrier_review.py --verify --out verification/robotron-keyboard/analog/reports/input-barrier
          python3 verification/robotron-keyboard/analog/electrical_status.py --check
      - name: CPU write-data setup and hold
        run: python3 verification/robotron-keyboard/analog/bus_timing_probe.py
      - name: CPU read sampling phase diagnostic
        run: |
          for kind in memory io indexed-opcode m1; do
            for profile in tv80 falling-candidate falling-indexed-candidate; do
              for wait_mode in plain wait; do
                extra=()
                if [ "$wait_mode" = wait ]; then extra+=(--wait); fi
                python3 verification/robotron-keyboard/analog/cpu_read_phase_probe.py \
                  --read-kind "$kind" --profile "$profile" "${extra[@]}" \
                  --out "build/keyboard-controller-analog/cpu-read-phase-$kind-$profile-$wait_mode"
              done
            done
          done
      - name: Resolved CPU ROM and latch bus
        run: python3 verification/robotron-keyboard/analog/resolved_bus_probe.py
      - name: Firmware serial observation failure controls
        run: |
          python3 verification/robotron-keyboard/analog/test_released_read_analysis.py
          python3 verification/robotron-keyboard/analog/test_serial_observation.py
          python3 verification/robotron-keyboard/analog/test_firmware_io_comparison.py
          python3 verification/robotron-keyboard/analog/test_receiver_margins.py
          python3 verification/robotron-keyboard/analog/test_io_scenario.py
          python3 verification/robotron-keyboard/analog/test_reset_observation.py
          python3 verification/robotron-keyboard/analog/test_board_scenario.py
          python3 verification/robotron-keyboard/analog/test_board_qualification.py
          python3 verification/robotron-keyboard/analog/test_clock_convergence.py
          python3 verification/robotron-keyboard/analog/test_oscillator_supply_replay.py
          python3 verification/robotron-keyboard/analog/test_xyce_oscillator_probe.py
          python3 verification/robotron-keyboard/analog/test_ls00_ibis_audit.py
          python3 verification/robotron-keyboard/analog/test_ls00_ibis_loadline.py
          python3 verification/robotron-keyboard/analog/test_ls00_ibis_spice.py
          python3 verification/robotron-keyboard/analog/test_gate_switching_probe.py
          python3 verification/robotron-keyboard/analog/test_ls00_parameter_screen.py
          python3 verification/robotron-keyboard/analog/test_oscillator_family_probe.py
          python3 verification/robotron-keyboard/analog/test_oscillator_candidate.py
          python3 verification/robotron-keyboard/analog/test_oscillator_transfer_probe.py
          python3 verification/robotron-keyboard/analog/test_ls00_branch_probe.py
          python3 verification/robotron-keyboard/analog/test_ls00_branch_transient.py
          python3 verification/robotron-keyboard/analog/test_oscillator_disturbance.py
          python3 verification/robotron-keyboard/analog/test_oscillator_ac_probe.py
          python3 verification/robotron-keyboard/analog/test_oscillator_internal_probe.py
          python3 verification/robotron-keyboard/analog/test_ls00_transfer_fixture.py
          python3 verification/robotron-keyboard/analog/test_xyce_transfer_fixture.py
          python3 verification/robotron-keyboard/analog/test_ls00_iv_probe.py
          python3 verification/robotron-keyboard/analog/test_ls00_rolloff_screen.py
          python3 verification/robotron-keyboard/analog/test_coupled_clock_probe.py
          python3 verification/robotron-keyboard/analog/test_matrix_load.py
          python3 verification/robotron-keyboard/analog/test_ngspice_runtime.py
          REFERENCE_NODE_NGSPICE=ngspice python3 verification/robotron-keyboard/analog/test_reference_node_replay.py
          python3 verification/robotron-keyboard/analog/test_linear_system_review.py
          python3 verification/robotron-keyboard/analog/test_linear_precision_review.py
          python3 verification/robotron-keyboard/analog/test_mpfr_linear_solver.py
          python3 verification/robotron-keyboard/analog/test_mpfr_integration.py
          python3 verification/robotron-keyboard/analog/test_state_trajectory_review.py
          python3 verification/robotron-keyboard/analog/test_represented_time_step.py
          python3 verification/robotron-keyboard/analog/test_capacitor_stamp_review.py
          python3 verification/robotron-keyboard/analog/test_capacitor_onset_review.py
          python3 verification/robotron-keyboard/analog/test_capacitor_assembly.py
          python3 verification/robotron-keyboard/analog/test_accepted_budget.py
          python3 verification/robotron-keyboard/analog/test_accepted_capture_review.py
          python3 verification/robotron-keyboard/analog/test_integration_method_replay.py
          python3 verification/robotron-keyboard/analog/test_mpfr_replay_comparison.py
          python3 verification/robotron-keyboard/analog/test_linear_startup_reference.py
          python3 verification/robotron-keyboard/analog/test_led_observation.py
          python3 verification/robotron-keyboard/analog/test_trace_io.py
          python3 verification/robotron-keyboard/analog/test_failure_evidence.py
          python3 verification/robotron-keyboard/analog/test_led_reference.py
          python3 verification/robotron-keyboard/analog/test_led_pair.py
          python3 verification/robotron-keyboard/analog/test_compressed_output.py
          python3 verification/robotron-keyboard/analog/test_live_capture.py
          python3 verification/robotron-keyboard/analog/test_raw_waveform.py
          python3 verification/robotron-keyboard/analog/test_live_raw_output.py
          python3 verification/robotron-keyboard/analog/test_live_raw_review.py
          python3 verification/robotron-keyboard/analog/test_live_raw_acceptance.py
          python3 verification/robotron-keyboard/analog/raw_pipe_review.py --check --out verification/robotron-keyboard/analog/reports/raw-pipe-transport
          python3 verification/robotron-keyboard/analog/retain_live_raw.py --check --out verification/robotron-keyboard/analog/reports/live-raw-output
          python3 verification/robotron-keyboard/analog/test_bus_inventory.py
          python3 verification/robotron-keyboard/analog/test_electrical_bus_interface.py
          python3 verification/robotron-keyboard/analog/test_bus_observation.py
          python3 verification/robotron-keyboard/analog/test_review_firmware_run.py
          python3 verification/robotron-keyboard/analog/test_eprom2716.py
          python3 verification/robotron-keyboard/analog/test_i8282_timing.py
      - name: Published 7406 topology and DC limits
        run: |
          python3 verification/robotron-keyboard/analog/test_ttl7406_probe.py
          python3 verification/robotron-keyboard/analog/test_ttl7406_output.py
          python3 verification/robotron-keyboard/analog/test_host_receiver.py
          python3 verification/robotron-keyboard/analog/test_ttl7404_probe.py
          python3 verification/robotron-keyboard/analog/test_host_input_review.py
          python3 verification/robotron-keyboard/analog/test_host_waveform_comparison.py
          python3 verification/robotron-keyboard/analog/test_host_transition_windows.py
          python3 verification/robotron-keyboard/analog/test_host_clock_widths.py
          python3 verification/robotron-keyboard/analog/test_write_control_observation.py
          python3 verification/robotron-keyboard/analog/test_transient_analysis.py
          python3 verification/robotron-keyboard/analog/test_supply_stimulus.py
          python3 verification/robotron-keyboard/analog/test_boot_preparation.py
          python3 verification/robotron-keyboard/analog/test_model_coverage.py
          python3 verification/robotron-keyboard/analog/ttl7406_output_probe.py
          python3 verification/robotron-keyboard/analog/ttl7406_output_probe.py --host-passives --out build/keyboard-controller-analog/host-passives
          python3 verification/robotron-keyboard/analog/host_input_review.py --run build/keyboard-controller-analog/host-passives --out build/keyboard-controller-analog/host-input-review.json
          python3 verification/robotron-keyboard/analog/ttl7404_probe.py --out build/keyboard-controller-analog/ttl7404-dc
          python3 verification/robotron-keyboard/analog/ttl7404_switching.py --out build/keyboard-controller-analog/ttl7404-switching
          python3 verification/robotron-keyboard/analog/ttl7406_output_probe.py --host-passives --host-buffer --out build/keyboard-controller-analog/host-buffer
          python3 verification/robotron-keyboard/analog/host_input_review.py --run build/keyboard-controller-analog/host-buffer --out build/keyboard-controller-analog/host-buffer-input-review.json
          python3 verification/robotron-keyboard/analog/ttl7406_output_probe.py --host-passives --host-buffer --sio-data-pf 5 --sio-clock-pf 50 --sio-leakage-ua 10 --out build/keyboard-controller-analog/host-buffer-load
          python3 verification/robotron-keyboard/analog/host_input_review.py --run build/keyboard-controller-analog/host-buffer-load --out build/keyboard-controller-analog/host-buffer-load-input-review.json
      - name: Reference analog sensing feasibility
        run: python3 verification/robotron-keyboard/analog/sense_probe.py
      - name: Clock pullup and U880 input-level regression
        run: |
          python3 verification/robotron-keyboard/analog/test_clock_output.py
          python3 verification/robotron-keyboard/analog/test_clock_voltage.py
          python3 verification/robotron-keyboard/analog/test_clock_timing.py
          python3 verification/robotron-keyboard/analog/test_cpu_control.py
          python3 verification/robotron-keyboard/analog/cpu_control_probe.py
          python3 verification/robotron-keyboard/analog/test_logic_control.py
          python3 verification/robotron-keyboard/analog/test_logic_interface.py
          python3 verification/robotron-keyboard/analog/logic_control_probe.py
          python3 verification/robotron-keyboard/analog/gate_probe.py --model verification/robotron-keyboard/analog/ls_nand_pullup.cir --require-qualified --out build/keyboard-controller-analog/gate-pullup-dc
          python3 verification/robotron-keyboard/analog/clock_output_probe.py
      - name: Nominal NAND switching regression
        run: python3 verification/robotron-keyboard/analog/gate_switching_probe.py --require-limits --out build/keyboard-controller-analog/gate-switching
      - name: Electrical matrix and generated HDL interface
        run: |
          python3 verification/robotron-keyboard/analog/matrix_probe.py
          python3 verification/robotron-keyboard/analog/matrix_probe.py --latch-load source-limit --out build/keyboard-controller-analog/matrix-source-limit
          python3 verification/robotron-keyboard/analog/matrix_probe.py --latch-load sink-limit --out build/keyboard-controller-analog/matrix-sink-limit
      - name: Reference reset, power cycling and BR2 isolation
        run: |
          python3 verification/robotron-keyboard/analog/test_reset_supply_observation.py
          python3 verification/robotron-keyboard/analog/test_reset_capacitance_review.py
          python3 verification/robotron-keyboard/analog/test_reset_capacitor_polarity.py
          python3 verification/robotron-keyboard/analog/test_reset_release_driver_review.py
          python3 verification/robotron-keyboard/analog/reset_release_audit_review.py --out verification/robotron-keyboard/analog/reports/reset-release-audit --check
          python3 verification/robotron-keyboard/analog/fixture_grid_review.py --out verification/robotron-keyboard/analog/reports/fixture-grid-reset --check
          python3 verification/robotron-keyboard/analog/fixture_grid_review.py --out verification/robotron-keyboard/analog/reports/fixture-grid-gear --check
          python3 verification/robotron-keyboard/analog/fixture_grid_review.py --out verification/robotron-keyboard/analog/reports/fixture-grid-sampling --check
          python3 verification/robotron-keyboard/analog/tolerance_controls_review.py --out verification/robotron-keyboard/analog/reports/fixture-grid-tolerances --check
          python3 verification/robotron-keyboard/analog/startup_passive_review.py --out verification/robotron-keyboard/analog/reports/startup-passive --check
          python3 verification/robotron-keyboard/analog/fixture_grid_review.py --out verification/robotron-keyboard/analog/reports/tight-passive-refinement --check
          python3 verification/robotron-keyboard/analog/fixture_grid_review.py --out verification/robotron-keyboard/analog/reports/nested-local-refinement --check
          python3 verification/robotron-keyboard/analog/fixture_grid_review.py --out verification/robotron-keyboard/analog/reports/dac-state-startup --check
          python3 verification/robotron-keyboard/analog/fixture_grid_review.py --out verification/robotron-keyboard/analog/reports/dac-anchored-startup --check
          python3 verification/robotron-keyboard/analog/fixture_grid_review.py --out verification/robotron-keyboard/analog/reports/startup-grid-density --check
          python3 verification/robotron-keyboard/analog/fixture_grid_review.py --out verification/robotron-keyboard/analog/reports/startup-tight-tolerance --check
          python3 verification/robotron-keyboard/analog/fixture_grid_review.py --out verification/robotron-keyboard/analog/reports/startup-voltage-tolerance --check
          python3 verification/robotron-keyboard/analog/fixture_grid_review.py --out verification/robotron-keyboard/analog/reports/startup-truncation --check
          python3 verification/robotron-keyboard/analog/fixture_grid_review.py --out verification/robotron-keyboard/analog/reports/dense-anchored-refinement --check
          python3 verification/robotron-keyboard/analog/fixture_grid_review.py --out verification/robotron-keyboard/analog/reports/transient-error-refinement --check
          python3 verification/robotron-keyboard/analog/fixture_grid_review.py --out verification/robotron-keyboard/analog/reports/filter-truncation --check
          python3 verification/robotron-keyboard/analog/fixture_grid_review.py --out verification/robotron-keyboard/analog/reports/filter-charge-history --check
          python3 verification/robotron-keyboard/analog/reset_probe.py
          python3 verification/robotron-keyboard/analog/reset_probe.py --reset-load reference-capacitance --npn-profile sc236-dc --supply-stimulus verification/robotron-keyboard/analog/supply-stimuli/brownout.json --stop-seconds .127 --out build/keyboard-controller-analog/reset-brownout
      - name: SC236D candidate DC limits and reset integration
        run: |
          python3 verification/robotron-keyboard/analog/reset_probe.py --reset-load reference-capacitance --npn-profile sc236-dc --out build/keyboard-controller-analog/reset-reference-capacitance
          python3 verification/robotron-keyboard/analog/device_probe.py --npn-profile sc236-dc --require-qualified
          python3 verification/robotron-keyboard/analog/reset_probe.py --npn-profile sc236-dc --out build/keyboard-controller-analog/reset-sc236
          python3 verification/robotron-keyboard/analog/reset_probe.py --npn-profile sc236-dc --rise-us .01 --source-ohms .1 --out build/keyboard-controller-analog/reset-fast-resistive
      - name: DL000 candidate static output and input limits
        run: python3 verification/robotron-keyboard/analog/gate_probe.py --model verification/robotron-keyboard/analog/ls_nand_dc.cir --require-qualified
      - name: Reference oscillator topology and BR1 isolation
        run: |
          python3 verification/robotron-keyboard/analog/oscillator_probe.py
          python3 verification/robotron-keyboard/analog/oscillator_probe.py --gate-profile dl000-dc --out build/keyboard-controller-analog/oscillator-dl000-dc
          python3 verification/robotron-keyboard/analog/oscillator_probe.py --steps-ns 1 .5 --reltol 1e-7 --vntol 1e-9 --abstol 1e-15 --require-phase --out build/keyboard-controller-analog/oscillator-phase
      - name: Serial, cable and LED electrical loads
        run: |
          python3 verification/robotron-keyboard/analog/test_output_filter.py
          python3 verification/robotron-keyboard/analog/output_probe.py
          python3 verification/robotron-keyboard/analog/output_probe.py --coupling .8 --out build/keyboard-controller-analog/filter-coupled
          python3 verification/robotron-keyboard/analog/output_probe.py --coupling .8 --dot-pins 1 2 1 1 --out build/keyboard-controller-analog/filter-reversed-return
  checks:
    name: ${{ matrix.target }} (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - {target: native, os: ubuntu-latest}
          - {target: native, os: macos-latest}
          - {target: wasm, os: ubuntu-latest}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - if: matrix.target == 'native'
        run: make -j4 test
      - name: Shared runtime memory and undefined-behavior checks
        if: matrix.target == 'native'
        run: make test-runtime-sanitize
      - name: Memory and undefined-behavior checks
        if: matrix.target == 'native'
        run: >-
          cc -std=c11 -O1 -g -fsanitize=address,undefined
          tests/integration/machines_test.c machines/robotron1715m/robotron.c machines/robotron1715m/disk.c
          machines/robotron1715m/keyboard_board.c machines/robotron1715m/keyboard_cpu.c machines/robotron1715m/sio.c
          machines/vjuga/vjuga.c common/cpu/z80.c common/media/media.c common/trace/trace.c
          -o /tmp/machines-test && /tmp/machines-test
      - name: Robotron peripheral memory and undefined-behavior checks
        if: matrix.target == 'native'
        run: >-
          cc -std=c11 -O1 -g -fsanitize=address,undefined
          tests/integration/robotron_devices_test.c machines/robotron1715m/robotron.c machines/robotron1715m/disk.c
          machines/robotron1715m/keyboard_board.c machines/robotron1715m/keyboard_cpu.c machines/robotron1715m/sio.c
          common/cpu/z80.c common/media/media.c common/trace/trace.c
          -o /tmp/robotron-devices-test && /tmp/robotron-devices-test
      - name: Install pinned Emscripten
        if: matrix.target == 'wasm'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout 35ff8a6d150541276abbc6bae512ca90bcfbe220
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.12
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.12
      - name: Build and test WASM
        if: matrix.target == 'wasm'
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          make NODE="$EMSDK_NODE" test-wasm
