name: Native and browser cores
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cores-${{ github.ref }}
  cancel-in-progress: true
jobs:
  keyboard-controller:
    name: Keyboard reference wiring and full bus audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y iverilog ngspice
      - run: make test-keyboard-controller audit-keyboard-controller
      - name: CPU write-data setup and hold
        run: python3 verification/robotron-keyboard/analog/bus_timing_probe.py
      - name: Resolved CPU ROM and latch bus
        run: python3 verification/robotron-keyboard/analog/resolved_bus_probe.py
      - name: Firmware serial observation failure controls
        run: |
          python3 verification/robotron-keyboard/analog/test_serial_observation.py
          python3 verification/robotron-keyboard/analog/test_firmware_io_comparison.py
          python3 verification/robotron-keyboard/analog/test_receiver_margins.py
          python3 verification/robotron-keyboard/analog/test_io_scenario.py
          python3 verification/robotron-keyboard/analog/test_reset_observation.py
          python3 verification/robotron-keyboard/analog/test_board_scenario.py
          python3 verification/robotron-keyboard/analog/test_board_qualification.py
          python3 verification/robotron-keyboard/analog/test_clock_convergence.py
          python3 verification/robotron-keyboard/analog/test_coupled_clock_probe.py
          python3 verification/robotron-keyboard/analog/test_matrix_load.py
          python3 verification/robotron-keyboard/analog/test_ngspice_runtime.py
          python3 verification/robotron-keyboard/analog/test_linear_startup_reference.py
          python3 verification/robotron-keyboard/analog/test_led_observation.py
          python3 verification/robotron-keyboard/analog/test_trace_io.py
          python3 verification/robotron-keyboard/analog/test_failure_evidence.py
          python3 verification/robotron-keyboard/analog/test_led_reference.py
      - name: Reference analog sensing feasibility
        run: python3 verification/robotron-keyboard/analog/sense_probe.py
      - name: Electrical matrix and generated HDL interface
        run: |
          python3 verification/robotron-keyboard/analog/matrix_probe.py
          python3 verification/robotron-keyboard/analog/matrix_probe.py --latch-load source-limit --out build/keyboard-controller-analog/matrix-source-limit
          python3 verification/robotron-keyboard/analog/matrix_probe.py --latch-load sink-limit --out build/keyboard-controller-analog/matrix-sink-limit
      - name: Reference reset, power cycling and BR2 isolation
        run: python3 verification/robotron-keyboard/analog/reset_probe.py
      - name: SC236D candidate DC limits and reset integration
        run: |
          python3 verification/robotron-keyboard/analog/device_probe.py --npn-profile sc236-dc --require-qualified
          python3 verification/robotron-keyboard/analog/reset_probe.py --npn-profile sc236-dc --out build/keyboard-controller-analog/reset-sc236
          python3 verification/robotron-keyboard/analog/reset_probe.py --npn-profile sc236-dc --rise-us .01 --source-ohms .1 --out build/keyboard-controller-analog/reset-fast-resistive
      - name: DL000 candidate static output and input limits
        run: python3 verification/robotron-keyboard/analog/gate_probe.py --model verification/robotron-keyboard/analog/ls_nand_dc.cir --require-qualified
      - name: Reference oscillator topology and BR1 isolation
        run: |
          python3 verification/robotron-keyboard/analog/oscillator_probe.py
          python3 verification/robotron-keyboard/analog/oscillator_probe.py --gate-profile dl000-dc --out build/keyboard-controller-analog/oscillator-dl000-dc
          python3 verification/robotron-keyboard/analog/oscillator_probe.py --steps-ns 1 .5 --reltol 1e-7 --vntol 1e-9 --abstol 1e-15 --require-phase --out build/keyboard-controller-analog/oscillator-phase
      - name: Serial, cable and LED electrical loads
        run: python3 verification/robotron-keyboard/analog/output_probe.py
  checks:
    name: ${{ matrix.target }} (${{ matrix.os }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - {target: native, os: ubuntu-latest}
          - {target: native, os: macos-latest}
          - {target: wasm, os: ubuntu-latest}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - if: matrix.target == 'native'
        run: make -j4 test
      - name: Shared runtime memory and undefined-behavior checks
        if: matrix.target == 'native'
        run: make test-runtime-sanitize
      - name: Memory and undefined-behavior checks
        if: matrix.target == 'native'
        run: >-
          cc -std=c11 -O1 -g -fsanitize=address,undefined
          tests/integration/machines_test.c machines/robotron1715m/robotron.c machines/robotron1715m/disk.c
          machines/robotron1715m/keyboard.c machines/robotron1715m/sio.c
          machines/vjuga/vjuga.c common/cpu/z80.c common/media/media.c common/trace/trace.c
          -o /tmp/machines-test && /tmp/machines-test
      - name: Robotron peripheral memory and undefined-behavior checks
        if: matrix.target == 'native'
        run: >-
          cc -std=c11 -O1 -g -fsanitize=address,undefined
          tests/integration/robotron_devices_test.c machines/robotron1715m/robotron.c machines/robotron1715m/disk.c
          machines/robotron1715m/keyboard.c machines/robotron1715m/sio.c
          common/cpu/z80.c common/media/media.c common/trace/trace.c
          -o /tmp/robotron-devices-test && /tmp/robotron-devices-test
      - name: Install pinned Emscripten
        if: matrix.target == 'wasm'
        run: |
          git clone https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" checkout 35ff8a6d150541276abbc6bae512ca90bcfbe220
          "$RUNNER_TEMP/emsdk/emsdk" install 6.0.12
          "$RUNNER_TEMP/emsdk/emsdk" activate 6.0.12
      - name: Build and test WASM
        if: matrix.target == 'wasm'
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          make NODE="$EMSDK_NODE" test-wasm
