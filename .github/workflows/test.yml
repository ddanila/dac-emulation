name: Native and browser cores
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cores-${{ github.ref }}
  cancel-in-progress: true
jobs:
  keyboard-controller:
    name: Keyboard reference wiring and full bus audit
    runs-on: ubuntu-latest
    # Include checkout and runner variability; keep all verification steps.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - name: Resolve keyboard verification dependencies
        id: keyboard-apt
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
          sudo apt-get "${apt_options[@]}" update
          apt-cache policy iverilog ngspice libmpfr-dev libgmp-dev pkg-config |
            awk '/^[^ ]/ {package=$1} /Candidate:/ {print package, $2}' > "$RUNNER_TEMP/keyboard-apt-versions"
          . /etc/os-release
          versions_hash=$(sha256sum "$RUNNER_TEMP/keyboard-apt-versions" | cut -d ' ' -f 1)
          echo "key=keyboard-apt-v1-${VERSION_ID}-$(dpkg --print-architecture)-${versions_hash}" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/keyboard-apt-archives"
      - name: Restore keyboard package archives
        id: keyboard-apt-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: ${{ runner.temp }}/keyboard-apt-archives/*.deb
          key: ${{ steps.keyboard-apt.outputs.key }}
      - name: Install keyboard verification dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 \
            -o Dir::Cache::archives="$RUNNER_TEMP/keyboard-apt-archives" \
            -o APT::Keep-Downloaded-Packages=true \
            install -y --no-install-recommends iverilog ngspice libmpfr-dev libgmp-dev pkg-config
      # Save before tests so a later test failure/timeout does not lose the download.
      - name: Save keyboard package archives
        if: steps.keyboard-apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/keyboard-apt-archives/*.deb
          key: ${{ steps.keyboard-apt.outputs.key }}
      - run: make test-keyboard-controller audit-keyboard-controller
      - name: Digital qualification gates and numerical diagnostics
        run: |
          python3 verification/robotron-keyboard/digital/test_qualify.py
          python3 verification/robotron-keyboard/digital/test_c_read_contract.py
          python3 verification/robotron-keyboard/digital/io_final_suite.py instructions
          python3 verification/robotron-keyboard/digital/io_flags_probe.py --quick --out build/keyboard-controller-io-flags-ci
          python3 verification/robotron-keyboard/digital/io_final_regression.py read
          python3 verification/robotron-keyboard/digital/io_final_regression.py nonio
          python3 verification/robotron-keyboard/digital/io_write_probe.py
          python3 verification/robotron-keyboard/digital/io_repeat_probe.py
          python3 verification/robotron-keyboard/digital/io_pin_review.py --require-pass
          python3 verification/robotron-keyboard/digital/io_boundary_evidence.py
          python3 verification/robotron-keyboard/digital/io_final_evidence.py
          python3 verification/robotron-keyboard/digital/cpu_bus_review.py
