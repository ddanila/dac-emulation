name: Extended keyboard digital qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Fetch pinned reference firmware
        run: |
          curl --fail --location --retry 3 https://raw.githubusercontent.com/ddanila/dac/46fcfb4f67f18bfbdc09c76744e0831ff1728cf4/public/media/robotron/s600.bin -o "$RUNNER_TEMP/s600.bin"
          printf '%s  %s\n' 4b54891c02a8ec279e2b8aec03489a961fc8647e08ad2036dcf82d0634bf7273 "$RUNNER_TEMP/s600.bin" | sha256sum -c -
      - name: Capture all declared scenarios
        id: capture
        continue-on-error: true
        run: python3 verification/robotron-keyboard/digital/qualify.py --rom "$RUNNER_TEMP/s600.bin"
      - name: Assess completion without timing alignment
        if: always() && steps.capture.outcome != 'skipped'
        run: python3 verification/robotron-keyboard/digital/review.py build/keyboard-controller-digital --out build/keyboard-controller-digital/completion.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: keyboard-digital-qualification
          path: |
            build/keyboard-controller-digital/**/*.json
            build/keyboard-controller-digital/**/*.txt
            build/keyboard-controller-digital/**/probe.c
            build/keyboard-controller-digital/**/bench.v
